# Basic information
base_info:
  project_name: test_prj
  build_mode_tags: ["EXAMPLE", "SIMULATION", "TEST_CAMERA"] # Build mode tags
  ibmw_import_options: # Some options when importing ibmw. See ibmw's CMakeLists.txt for all details
    IBMW_BUILD_TESTS: "OFF" # Note that the quotes for "ON"/"OFF" are required, otherwise pyyaml will parse them as True/False
    IBMW_BUILD_EXAMPLES: "OFF"
    IBMW_BUILD_RUNTIME: "ON"
    IBMW_BUILD_PROTOCOLS: "ON"
    IBMW_BUILD_CLI_TOOLS: "OFF"
    IBMW_BUILD_WITH_ROS2: "OFF"
    IBMW_BUILD_NET_EXTENSION: "OFF"
    IBMW_BUILD_ROS2_EXTENSION: "OFF"
    IBMW_BUILD_MQTT_EXTENSION: "OFF"
    IBMW_BUILD_ZENOH_EXTENSION: "OFF"
    IBMW_BUILD_ICEORYX_EXTENSION: "OFF"
    IBMW_BUILD_DDS_EXTENSION: "OFF"
    # ...

# Dependent ibmw modules
depends_std_modules:
  # - name: ibmw-xxx-module
  #   git_repository: https://github.com/xxxx/ibmw-xxx-module.git
  #   git_tag: v0.1.5
  #   import_options:
  #     XXX: "ON"

# protocol
protocols:
  - name: my_idl
    type: dds_idl
    options:
      xxx: xxx
  - name: my_ros2_proto
    type: ros2
    options:
      zzz: zzz
    build_mode_tag: ["EXAMPLE"]
  - name: example_idl
    type: dds_idl
    build_mode_tag: ["EXAMPLE"] #Built only if EXAMPLE mode is true. If the build_mode_tag is not set, it means that it is built in all modes by default.

# Module
modules:
  - name: my_foo_module
  - name: my_bar_module
  - name: exmaple_module
    build_mode_tag: ["EXAMPLE"]
    options:
      aaa: aaa

# pkg
pkgs:
  - name: pkg1
    modules:
      - name: my_foo_module
        namespace: local
      - name: my_bar_module
        namespace: local
    options:
      sss: sss
  - name: pkg2
    modules:
      - name: exmaple_module
        namespace: local
      # - name: third_party_module
      #   namespace: third_party_module
    build_mode_tag: ["EXAMPLE"]
    options:
      sss: sss

# deploy
deploy_modes:
  - name: exmaple_mode
    build_mode_tag: ["EXAMPLE"]
    deploy_ins:
      - name: local_ins_1
        pkgs:
          - name: pkg1
            options:
              disable_modules: []
      - name: local_ins_2
      - name: remote_ins_123

  - name: deploy_mode_1
  - name: deploy_mode_2
