#
# shm_interproc_demo - subscriber process configuration.
#
# iceoryx_interproc_demo/cfg/subscriber.yaml with the extension item switched
# to the self-developed shm transport (libibmw_shm_transport.so, driver
# "shm"). No RouDi daemon: both processes meet in the same shm root
# ($IBMW_SHM_ROOT when set, else /dev/shm, else /tmp) and domain.
#
# Subscriber side does not allocate publisher segments, so shm_init_size is
# largely cosmetic here, but we keep it explicit to mirror the publisher
# config.

ibmw:
  extensions:
    items:
      - name: shm_extension
        path: ./libibmw_shm_transport.so
        options:
          shm_init_size: 256
          runtime_id: "shm_demo_sub"

  logging:
    core_level: INFO
    backends:
      - type: console

  scheduling:
    executors:
      - name: work_thread_pool
        type: thread_pool
        options:
          thread_num: 2

  messaging:
    drivers:
      - type: shm
        options:
          listener_thread_name: "shm_sub_listen"
    subscribers:
      - topic: "compressed_image_topic"
        enable_drivers: [shm]

  modules:
    modules:
      - name: SubscriberModule
        log_level: INFO
