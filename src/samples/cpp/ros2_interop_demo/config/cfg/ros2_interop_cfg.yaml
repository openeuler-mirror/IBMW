# ROS2 Interop Demo Configuration

ibmw:
  extensions:
    items:
      - name: dds_extension
        path: ./libibmw_dds_transport.so
        options:
          domain_id: 0
          ros2_compatible_mode: true
          ros2_topic_prefix: "rt"

  scheduling:
    executors:
      - name: main_executor
        type: thread_pool
        options:
          thread_num: 4

  logging:
    core_level: INFO
    backends:
      - type: console

  modules:
    modules:
      - name: PublisherModule
        log_level: INFO
      - name: SubscriberModule
        log_level: INFO

  messaging:
    drivers:
      - type: dds
        options:
          publishers:
            - topic: "(.*)"
              qos:
                history: keep_last
                depth: 10
                reliability: reliable
                durability: volatile
          subscribers:
            - topic: "(.*)"
              qos:
                history: keep_last
                depth: 10
                reliability: reliable
                durability: volatile

    publishers:
      - topic: "chatter"
        enable_drivers: [dds]

    subscribers:
      - topic: "chatter"
        enable_drivers: [dds]
