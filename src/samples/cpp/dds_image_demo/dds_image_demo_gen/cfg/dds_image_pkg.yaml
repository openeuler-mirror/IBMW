# IBMW config for dds_image_app (Pkg mode)
#
# Usage: ibmw run cfg/dds_image_pkg.yaml

ibmw:
  logging:
    core_level: INFO
    backends:
      - type: console

  extensions:
    items:
      - name: dds_extension
        path: libibmw_dds_transport.so
        options:
          domain_id: 0

  scheduling:
    executors:
      - name: work_thread_pool
        type: thread_pool
        options:
          thread_num: 2

  messaging:
    drivers:
      - type: dds
        options:
          publishers:
            - topic: "(.*)"
              qos:
                history: keep_last
                depth: 10
                reliability: reliable
                durability: volatile
          subscribers:
            - topic: "(.*)"
              qos:
                history: keep_last
                depth: 10
                reliability: reliable
                durability: volatile
    publishers:
      - topic: "image_topic"
        enable_drivers: [dds]
    subscribers:
      - topic: "image_topic"
        enable_drivers: [dds]

  modules:
    packages:
      - path: libdds_image_pkg.so
        enable_modules: [ImagePublisher, ImageSubscriber]
    modules:
      - name: ImagePublisher
        log_level: INFO
      - name: ImageSubscriber
        log_level: INFO
