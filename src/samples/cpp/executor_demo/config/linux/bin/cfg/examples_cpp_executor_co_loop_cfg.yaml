ibmw:
  logging:
    core_level: INFO # Trace/Debug/Info/Warn/Error/Fatal/Off
    backends:
      - type: console
  scheduling:
    executors:
      - name: time_schedule_executor
        type: thread_pool
  modules:
    packages:
      - path: ./libexecutor_pkg.so
        enable_modules: [ExecutorCoLoopModule]
    modules:
      - name: ExecutorCoLoopModule
        log_level: INFO
