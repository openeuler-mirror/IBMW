ibmw:
  logging:
    core_level: INFO # Trace/Debug/Info/Warn/Error/Fatal/Off
    backends:
      - type: console
  scheduling:
    executors:
      - name: work_executor
        type: thread_pool
        options:
          thread_num: 2
      - name: thread_safe_executor
        type: thread_pool
        options:
          thread_num: 1
      - name: time_schedule_executor
        type: thread_pool
        options:
          thread_num: 2
  modules:
    packages:
      - path: ./libexecutor_pkg.so
        enable_modules: [ExecutorCoModule]
    modules:
      - name: ExecutorCoModule
        log_level: INFO
