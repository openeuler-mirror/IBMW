# IBMW config for executor_co_loop_app (Pkg mode)
#
# Usage: ibmw run cfg/executor_co_loop_module_pkg.yaml

ibmw:
  logging:
    core_level: INFO
    backends:
      - type: console

  scheduling:
    executors:
      - name: time_schedule_executor
        type: thread_pool

  modules:
    packages:
      - path: libexecutor_co_loop_module_pkg.so
        enable_modules: [ExecutorCoLoopModule]
    modules:
      - name: ExecutorCoLoopModule
        log_level: INFO
