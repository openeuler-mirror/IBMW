# IBMW config for executor_co_app (App mode)
#
# Usage: ./executor_co_app cfg/executor_co_app.yaml

ibmw:
  logging:
    core_level: INFO
    backends:
      - type: console

  scheduling:
    executors:
      - name: work_executor
        type: thread_pool
        options:
          thread_num: 2
      - name: thread_safe_executor
        type: thread_pool
        options:
          thread_num: 1
      - name: time_schedule_executor
        type: thread_pool
        options:
          thread_num: 2

  modules:
    modules:
      - name: ExecutorCoModule
        log_level: INFO
