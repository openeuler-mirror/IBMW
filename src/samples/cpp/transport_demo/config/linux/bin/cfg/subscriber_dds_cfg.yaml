# pubsub_demo: Subscriber with DDS driver (pkg mode)

ibmw:
  extensions:
    items:
      - name: dds_extension
        path: libibmw_dds_transport.so
        options:
          domain_id: 0
          participant_name: ibmw_pubsub_demo_subscriber_node

  logging:
    core_level: INFO
    backends:
      - type: console

  scheduling:
    executors:
      - name: work_thread_pool
        type: thread_pool
        options:
          thread_num: 2

  messaging:
    drivers:
      - type: dds
        options:
          subscribers:
            - topic: "(.*)"
              qos:
                history: keep_last
                depth: 10
                reliability: reliable
                durability: volatile
    subscribers:
      - topic: "hello_topic"
        enable_drivers: [dds]

  modules:
    modules:
      - name: SubscriberModule
        log_level: INFO
