# pubsub_demo: Single process with Zenoh driver (pkg mode)

ibmw:
  extensions:
    items:
      - name: zenoh_extension
        path: ./libibmw_zenoh_transport.so
        options:
          shm_pool_size: 10485760
          shm_init_loan_size: 1024

  logging:
    core_level: INFO
    backends:
      - type: console

  scheduling:
    executors:
      - name: work_thread_pool
        type: thread_pool
        options:
          thread_num: 2

  messaging:
    drivers:
      - type: zenoh
        options:
          publishers:
            - topic: "hello_topic"
              shm_enabled: false
    publishers:
      - topic: "hello_topic"
        enable_drivers: [zenoh]
    subscribers:
      - topic: "hello_topic"
        enable_drivers: [zenoh]

  modules:
    packages:
      - path: ./libpubsub_demo_publisher_pkg.so
      - path: ./libpubsub_demo_subscriber_pkg.so
    modules:
      - name: PublisherModule
        log_level: INFO
      - name: SubscriberModule
        log_level: INFO
