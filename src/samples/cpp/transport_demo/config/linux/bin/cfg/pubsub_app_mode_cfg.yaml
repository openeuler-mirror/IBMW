# pubsub_demo: Single process with local driver (app mode - standalone)

ibmw:
  logging:
    core_level: INFO
    backends:
      - type: console

  scheduling:
    executors:
      - name: work_thread_pool
        type: thread_pool
        options:
          thread_num: 2

  messaging:
    drivers:
      - type: local
    publishers:
      - topic: "hello_topic"
        enable_drivers: [local]
    subscribers:
      - topic: "hello_topic"
        enable_drivers: [local]

  modules:
    modules:
      - name: PublisherModule
        log_level: INFO
      - name: SubscriberModule
        log_level: INFO
