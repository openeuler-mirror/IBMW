# DDS subscriber Runtime for playback_demo.

ibmw:
  extensions:
    items:
      - name: dds_extension
        path: ./libibmw_dds_transport.so
        options:
          domain_id: 0
          participant_name: playback_demo_subscriber

  logging:
    core_level: INFO
    backends:
      - type: console

  scheduling:
    executors:
      - name: work_thread_pool
        type: thread_pool
        options:
          thread_num: 2

  messaging:
    drivers:
      - type: dds
        options:
          subscribers:
            - topic: playback_demo_topic
              qos:
                history: keep_last
                depth: 10
                reliability: reliable
                durability: volatile
    subscribers:
      - topic: playback_demo_topic
        enable_drivers: [dds]

  modules:
    packages:
      - path: ./libplayback_demo_pkg.so
        enable_modules: [PlaybackSubscriberModule]
    modules:
      - name: PlaybackSubscriberModule
        log_level: INFO

PlaybackSubscriberModule:
  topic: playback_demo_topic
