ibmw:
  logging:
    core_level: INFO
    backends:
      - type: console
  scheduling:
    executors:
      - name: work_thread_pool
        type: thread_pool
        options:
          thread_num: 4
      - name: timeout_handle
        type: timer
        options:
          bind_executor: work_thread_pool
      - name: time_schedule_executor
        type: thread_pool
        options:
          thread_num: 1
  service:
    drivers:
      - type: local
        options:
          timeout_executor: timeout_handle
    clients:
      - func_name: "(.*)"
        enable_drivers: [local]
    servers:
      - func_name: "(.*)"
        enable_drivers: [local]
  modules:
    packages:
      - path: ./libcontext_pkg.so
        enable_modules: [RpcServerOnExecutorModule, RpcClientModule]
    modules:
      - name: RpcServerOnExecutorModule
        log_level: INFO
      - name: RpcClientModule
        log_level: INFO

# Module custom configuration
RpcClientModule:
  rpc_frq: 0.5
