ibmw:
  logging:
    core_level: INFO # Trace/Debug/Info/Warn/Error/Fatal/Off
    backends:
      - type: console
  scheduling:
    executors:
      - name: work_executor
        type: dedicated
  modules:
    packages:
      - path: ./libcontext_pkg.so
        enable_modules: [ContextLoggerModule]
    modules:
      - name: ContextLoggerModule
        log_level: TRACE
