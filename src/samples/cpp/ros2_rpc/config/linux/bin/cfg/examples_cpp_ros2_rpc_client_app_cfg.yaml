ibmw:
  logging:
    core_level: INFO # Trace/Debug/Info/Warn/Error/Fatal/Off
    backends:
      - type: console
  scheduling:
    executors:
      - name: work_thread_pool
        type: thread_pool
        options:
          thread_num: 4
      - name: timeout_handle
        type: thread_pool
        options:
          thread_num: 1
  service:
    drivers:
      - type: local
        options:
          timeout_handle_executor: timeout_handle
    clients:
      - func_name: "(.*)"
        enable_drivers: [local]
    servers:
      - func_name: "(.*)"
        enable_drivers: [local]
  modules:
    packages:
      - path: ./libros2_rpc_server_pkg.so
        enable_modules: [NormalRpcSyncServerModule]
    modules:
      - name: NormalRpcSyncClientModule
        log_level: INFO
      - name: NormalRpcSyncServerModule
        log_level: INFO

# Module custom configuration
NormalRpcSyncClientModule:
  rpc_frq: 0.5

NormalRpcSyncServerModule:
