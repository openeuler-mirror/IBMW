ibmw:
  logging:
    core_level: INFO # Trace/Debug/Info/Warn/Error/Fatal/Off
    backends:
      - type: console
  scheduling:
    executors:
      - name: work_thread_pool
        type: thread_pool
        options:
          thread_num: 4
      - name: timeout_handle
        type: timer
        options:
          bind_executor: work_thread_pool
  service:
    drivers:
      - type: local
        options:
          timeout_executor: timeout_handle
    clients:
      - func_name: "(.*)"
        enable_drivers: [local]
    servers:
      - func_name: "(.*)"
        enable_drivers: [local]
  modules:
    packages:
      - path: ./libros2_rpc_client_pkg.so
        enable_modules: [NormalRpcAsyncClientModule]
      - path: ./libros2_rpc_server_pkg.so
        enable_modules: [NormalRpcAsyncServerModule]
    modules:
      - name: NormalRpcAsyncClientModule
        log_level: INFO
      - name: NormalRpcAsyncServerModule
        log_level: INFO

# Module custom configuration
NormalRpcAsyncClientModule:
  rpc_frq: 0.5

NormalRpcAsyncServerModule:
