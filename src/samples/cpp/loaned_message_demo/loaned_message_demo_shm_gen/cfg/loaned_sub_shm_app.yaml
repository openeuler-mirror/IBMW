# IBMW config for loaned_sub_shm_app (App mode)
#
# Usage: ./loaned_sub_shm_app cfg/loaned_sub_shm_app.yaml

ibmw:
  logging:
    core_level: INFO
    backends:
      - type: console

  extensions:
    items:
      - name: shm_extension
        path: libibmw_shm_transport.so

  scheduling:
    executors:
      - name: work_thread_pool
        type: thread_pool
        options:
          thread_num: 2

  messaging:
    drivers:
      - type: shm
    subscribers:
      - topic: "point_topic"
        enable_drivers: [shm]

  modules:
    modules:
      - name: PointShmLoanedSubscriber
        log_level: INFO
