# IBMW config for loaned_sub_iox_app (App mode)
#
# Usage: ./loaned_sub_iox_app cfg/loaned_sub_iox_app.yaml
#
# Prerequisite: iceoryx RouDi must be running first, e.g.:
#   nohup ./iox-roudi > /tmp/roudi.log 2>&1 &
# (kill via:  ps -ef | grep iox-roudi  +  kill -9 <PID>)

ibmw:
  logging:
    core_level: INFO
    backends:
      - type: console

  extensions:
    items:
      - name: iceoryx_extension
        path: libibmw_iceoryx_transport.so

  scheduling:
    executors:
      - name: work_thread_pool
        type: thread_pool
        options:
          thread_num: 2

  messaging:
    drivers:
      - type: iceoryx
    subscribers:
      - topic: "point_topic"
        enable_drivers: [iceoryx]

  modules:
    modules:
      - name: PointIceoryxLoanedSubscriber
        log_level: INFO
