# Self-developed shm publisher process for record_demo.  No RouDi daemon is
# needed; the recorder must resolve the same shm root and domain
# ($IBMW_SHM_ROOT / $IBMW_SHM_DOMAIN, or the defaults /dev/shm (/tmp when unusable) and "default").

ibmw:
  config:
    temp_cfg_path: ./cfg/tmp/record-demo-shm
  runtime_graph:
    runtime_id: record-demo-shm
    type_support_pkgs:
      - path: ./libcommon_dds_ts.so

  extensions:
    items:
      - name: shm_extension
        path: ./libibmw_shm_transport.so
        options:
          shm_init_size: 1024
          runtime_id: record_demo_shm_publisher
      - name: record_playback_extension
        path: ./libibmw_record_playback.so
        options: {}

  logging:
    core_level: INFO
    backends:
      - type: console

  scheduling:
    executors:
      - name: work_thread_pool
        type: thread_pool
        options:
          thread_num: 2

  messaging:
    drivers:
      - type: shm
    publishers:
      - topic: record_demo_shm_topic
        enable_drivers: [shm]

  modules:
    packages:
      - path: ./librecord_demo_pkg.so
        enable_modules: [CdrPublisherModule]
    modules:
      - name: CdrPublisherModule
        log_level: INFO

CdrPublisherModule:
  topic: record_demo_shm_topic
  transport_frq: 1.0
