# Iceoryx publisher process for record_demo.  Start iox-roudi first.

ibmw:
  config:
    temp_cfg_path: ./cfg/tmp/record-demo-iceoryx
  runtime_graph:
    runtime_id: record-demo-iceoryx
    type_support_pkgs:
      - path: ./libcommon_dds_ts.so

  extensions:
    items:
      - name: iceoryx_extension
        path: ./libibmw_iceoryx_transport.so
        options:
          shm_init_size: 1024
          runtime_id: record_demo_iceoryx_publisher
      - name: record_playback_extension
        path: ./libibmw_record_playback.so
        options: {}

  logging:
    core_level: INFO
    backends:
      - type: console

  scheduling:
    executors:
      - name: work_thread_pool
        type: thread_pool
        options:
          thread_num: 2

  messaging:
    drivers:
      - type: iceoryx
    publishers:
      - topic: record_demo_iceoryx_topic
        enable_drivers: [iceoryx]

  modules:
    packages:
      - path: ./librecord_demo_pkg.so
        enable_modules: [CdrPublisherModule]
    modules:
      - name: CdrPublisherModule
        log_level: INFO

CdrPublisherModule:
  topic: record_demo_iceoryx_topic
  transport_frq: 1.0
