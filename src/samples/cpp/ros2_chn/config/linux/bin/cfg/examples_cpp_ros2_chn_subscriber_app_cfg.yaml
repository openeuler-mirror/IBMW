ibmw:
  logging:
    core_level: INFO # Trace/Debug/Info/Warn/Error/Fatal/Off
    backends:
      - type: console
  scheduling:
    executors:
      - name: work_thread_pool
        type: thread_pool
        options:
          thread_num: 4
  messaging:
    drivers:
      - type: local
        options:
          subscriber_use_inline_executor: false
          subscriber_executor: work_thread_pool
    publishers:
      - topic: "(.*)"
        enable_drivers: [local]
    subscribers:
      - topic: "(.*)"
        enable_drivers: [local]
  modules:
    packages:
      - path: ./libros2_chn_pub_pkg.so
        enable_modules: [NormalPublisherModule]
    modules:
      - name: NormalPublisherModule
        log_level: INFO
      - name: NormalSubscriberModule
        log_level: INFO

# Module custom configuration
NormalPublisherModule:
  topic: test_topic
  transport_frq: 0.5

NormalSubscriberModule:
  topic: test_topic
