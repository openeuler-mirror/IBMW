# IBMW config for ros2_chn_app (App mode)
#
# Usage: ./ros2_chn_app cfg/ros2_chn_app.yaml

ibmw:
  logging:
    core_level: INFO
    backends:
      - type: console

  scheduling:
    executors:
      - name: work_thread_pool
        type: thread_pool
        options:
          thread_num: 2

  messaging:
    drivers:
      - type: local
    publishers:
      - topic: "test_topic"
        enable_drivers: [local]
    subscribers:
      - topic: "test_topic"
        enable_drivers: [local]

  modules:
    modules:
      - name: NormalPublisherModule
        log_level: INFO
      - name: NormalSubscriberModule
        log_level: INFO
