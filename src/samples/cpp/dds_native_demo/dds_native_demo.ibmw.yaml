schema_version: 2
project:
  name: dds_native_demo
  namespace: dds_native_demo

messages:
  HelloMsg: {}
custom_dds_types:
  namespace: "ibmw::examples::dds_native_demo"
  messages:
    - name: HelloMsg
      constructor_args: true
      fields:
        - {name: id, type: uint64, default: "0"}
        - {name: message, type: string}
        - {name: timestamp, type: int64, default: "0"}

modules:
  - name: PublisherModule
    type: publisher
    transport: dds
    topic: hello_topic
    message: HelloMsg
    user_code:
      publish_body: |
        msg_count_++;
        msg.id = msg_count_;
        msg.message = "hello";
        msg.timestamp = std::chrono::duration_cast<std::chrono::nanoseconds>(
                            std::chrono::steady_clock::now().time_since_epoch())
                            .count();
  - name: SubscriberModule
    type: subscriber
    transport: dds
    topic: hello_topic
    message: HelloMsg
    user_code:
      on_message_body: |
        MW_INFO("Received message: id={}, message='{}', timestamp={}",
                msg->id, msg->message, msg->timestamp);
apps:
  - name: dds_native_app
    type: pubsub
    modules: [PublisherModule, SubscriberModule]
