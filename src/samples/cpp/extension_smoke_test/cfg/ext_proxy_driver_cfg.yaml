# Extension smoke test: proxy_extension
# Loads proxy extension with no proxy actions.
# The extension loads cleanly without any message relay configuration.

ibmw:
  extensions:
    items:
      - name: proxy_extension
        path: ./libibmw_proxy_driver.so
        options: {}

  logging:
    core_level: INFO
    backends:
      - type: console

  scheduling:
    executors:
      - name: work_thread_pool
        type: thread_pool
        options:
          thread_num: 2

  modules:
    packages:
      - path: ./libhelloworld_pkg.so
    modules:
      - name: HelloWorldModule
        log_level: INFO
