# Extension smoke test: topic_logger_extension
# Loads topic_logger extension which registers logger driver type "topic_logger"
# Extension loads cleanly without instantiating the driver backend (init/shutdown only)

ibmw:
  extensions:
    items:
      - name: topic_logger_extension
        path: ./libibmw_topic_logger.so
        options: {}

  logging:
    core_level: INFO
    backends:
      - type: console

  scheduling:
    executors:
      - name: work_thread_pool
        type: thread_pool
        options:
          thread_num: 2

  modules:
    packages:
      - path: ./libhelloworld_pkg.so
    modules:
      - name: HelloWorldModule
        log_level: INFO
