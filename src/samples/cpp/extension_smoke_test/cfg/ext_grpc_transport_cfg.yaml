# Extension smoke test: grpc_extension
# Loads gRPC transport in client-only mode (no external server needed)

ibmw:
  extensions:
    items:
      - name: grpc_extension
        path: ./libibmw_grpc_transport.so
        options:
          thread_num: 2

  logging:
    core_level: INFO
    backends:
      - type: console

  scheduling:
    executors:
      - name: work_thread_pool
        type: thread_pool
        options:
          thread_num: 2

  modules:
    packages:
      - path: ./libhelloworld_pkg.so
    modules:
      - name: HelloWorldModule
        log_level: INFO
