# Extension smoke test: grpc_extension with server
# Creates gRPC server + RPC service for loopback testing

ibmw:
  extensions:
    items:
      - name: grpc_extension
        path: ./libibmw_grpc_transport.so
        options:
          thread_num: 2
          listen_ip: "127.0.0.1"
          listen_port: 50051

  logging:
    core_level: INFO
    backends:
      - type: console

  scheduling:
    executors:
      - name: work_thread_pool
        type: thread_pool
        options:
          thread_num: 2
      - name: time_schedule_executor
        type: thread_pool
        options:
          thread_num: 1
      - name: timeout_handle
        type: timer
        options:
          bind_executor: work_thread_pool

  service:
    drivers:
      - type: grpc
        options:
          clients:
            - func_name: "(.*)"
              server_url: "127.0.0.1:50051"
    clients:
      - func_name: "(.*)"
        enable_drivers: [grpc]
    servers:
      - func_name: "(.*)"
        enable_drivers: [grpc]

  modules:
    packages:
      - path: ./libcontext_pkg.so
        enable_modules: [RpcClientModule, RpcServerInlineModule]
    modules:
      - name: RpcClientModule
        log_level: INFO
      - name: RpcServerInlineModule
        log_level: INFO

# Module custom configuration
RpcClientModule:
  rpc_frq: 0.5
