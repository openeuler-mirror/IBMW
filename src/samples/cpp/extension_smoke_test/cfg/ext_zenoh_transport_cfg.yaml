# Extension smoke test: zenoh_extension
# Loads Zenoh transport in client-only mode (no external peer needed for init)

ibmw:
  extensions:
    items:
      - name: zenoh_extension
        path: ./libibmw_zenoh_transport.so
        options:
          shm_pool_size: 10485760
          shm_init_loan_size: 1024

  logging:
    core_level: INFO
    backends:
      - type: console

  scheduling:
    executors:
      - name: work_thread_pool
        type: thread_pool
        options:
          thread_num: 2

  modules:
    packages:
      - path: ./libhelloworld_pkg.so
    modules:
      - name: HelloWorldModule
        log_level: INFO
