# Extension smoke test: mqtt_extension
# Loads MQTT transport (client-only, no broker connection needed for init)

ibmw:
  extensions:
    items:
      - name: mqtt_extension
        path: ./libibmw_mqtt_transport.so
        options:
          broker_addr: "tcp://127.0.0.1:1883"
          client_id: "ibmw_smoke_test"

  logging:
    core_level: INFO
    backends:
      - type: console

  scheduling:
    executors:
      - name: work_thread_pool
        type: thread_pool
        options:
          thread_num: 2

  modules:
    packages:
      - path: ./libhelloworld_pkg.so
    modules:
      - name: HelloWorldModule
        log_level: INFO
