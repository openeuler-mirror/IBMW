# Independently owned UDP loopback configuration for record smoke.
ibmw:
  config:
    temp_cfg_path: ./cfg/tmp/record-smoke-udp
  runtime_graph:
    runtime_id: record-smoke-udp
    type_support_pkgs:
      - path: ./libcommon_dds_ts.so
  extensions:
    items:
      - name: net_extension
        path: ./libibmw_net_transport.so
        options:
          thread_num: 2
          udp_options:
            listen_ip: 127.0.0.1
            listen_port: 50182
            max_pkg_size: 65536
      - name: record_playback_extension
        path: ./libibmw_record_playback.so
        options: {}
  logging:
    core_level: INFO
    backends: [{type: console}]
  scheduling:
    executors:
      - name: record_smoke_executor
        type: thread_pool
        options: {thread_num: 2}
  messaging:
    drivers:
      - type: udp
        options:
          publishers:
            - topic: /ibmw_record_smoke/transport/udp
              server_url_list: [127.0.0.1:50182]
    publishers:
      - topic: /ibmw_record_smoke/transport/udp
        enable_drivers: [udp]
    subscribers:
      - topic: /ibmw_record_smoke/transport/udp
        enable_drivers: [udp]
  modules:
    packages:
      - path: ./librecord_smoke_pkg.so
        enable_modules: [RecordSmokeCdrModule]
    modules:
      - name: RecordSmokeCdrModule
        log_level: INFO
RecordSmokeCdrModule:
  publish_topics: [/ibmw_record_smoke/transport/udp]
  subscribe_topics: [/ibmw_record_smoke/transport/udp]
  frequency_hz: 10.0
