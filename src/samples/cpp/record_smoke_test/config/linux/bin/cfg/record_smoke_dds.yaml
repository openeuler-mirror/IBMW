# Independently owned DDS transport configuration for record smoke.
ibmw:
  config:
    temp_cfg_path: ./cfg/tmp/record-smoke-dds
  extensions:
    items:
      - name: dds_extension
        path: ./libibmw_dds_transport.so
        options:
          domain_id: 87
          participant_name: record_smoke_dds_publisher
      - name: record_playback_extension
        path: ./libibmw_record_playback.so
        options:
          enable_runtime_agent: true
          runtime_id: record-smoke-dds
          runtime_registry_path: /tmp/ibmw/runtimes
          type_support_pkgs:
            - path: ./libcommon_dds_ts.so
  logging:
    core_level: INFO
    backends: [{type: console}]
  scheduling:
    executors:
      - name: record_smoke_executor
        type: thread_pool
        options: {thread_num: 2}
  messaging:
    drivers:
      - type: dds
        options:
          publishers:
            - topic: /ibmw_record_smoke/transport/dds
              qos:
                history: keep_last
                depth: 20
                reliability: reliable
                durability: volatile
    publishers:
      - topic: /ibmw_record_smoke/transport/dds
        enable_drivers: [dds]
  modules:
    packages:
      - path: ./librecord_smoke_pkg.so
        enable_modules: [RecordSmokeCdrModule]
    modules:
      - name: RecordSmokeCdrModule
        log_level: INFO
RecordSmokeCdrModule:
  publish_topics: [/ibmw_record_smoke/transport/dds]
  frequency_hz: 10.0
