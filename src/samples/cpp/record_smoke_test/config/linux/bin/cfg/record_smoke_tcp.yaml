# Independently owned TCP loopback configuration for record smoke.
ibmw:
  config:
    temp_cfg_path: ./cfg/tmp/record-smoke-tcp
  runtime_graph:
    runtime_id: record-smoke-tcp
    type_support_pkgs:
      - path: ./libcommon_dds_ts.so
  extensions:
    items:
      - name: net_extension
        path: ./libibmw_net_transport.so
        options:
          thread_num: 2
          tcp_options: {listen_ip: 127.0.0.1, listen_port: 50181}
      - name: record_playback_extension
        path: ./libibmw_record_playback.so
        options: {}
  logging:
    core_level: INFO
    backends: [{type: console}]
  scheduling:
    executors:
      - name: record_smoke_executor
        type: thread_pool
        options: {thread_num: 2}
  messaging:
    drivers:
      - type: tcp
        options:
          publishers:
            - topic: /ibmw_record_smoke/transport/tcp
              server_url_list: [127.0.0.1:50181]
    publishers:
      - topic: /ibmw_record_smoke/transport/tcp
        enable_drivers: [tcp]
    subscribers:
      - topic: /ibmw_record_smoke/transport/tcp
        enable_drivers: [tcp]
  modules:
    packages:
      - path: ./librecord_smoke_pkg.so
        enable_modules: [RecordSmokeCdrModule]
    modules:
      - name: RecordSmokeCdrModule
        log_level: INFO
RecordSmokeCdrModule:
  publish_topics: [/ibmw_record_smoke/transport/tcp]
  subscribe_topics: [/ibmw_record_smoke/transport/tcp]
  frequency_hz: 10.0
