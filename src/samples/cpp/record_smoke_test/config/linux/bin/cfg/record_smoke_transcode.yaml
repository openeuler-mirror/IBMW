# Independent CDR-to-JSON serialization configuration.
ibmw:
  config:
    temp_cfg_path: ./cfg/tmp/record-smoke-transcode
  runtime_graph:
    runtime_id: record-smoke-transcode
    type_support_pkgs:
      - path: ./librecord_smoke_ts.so
  extensions:
    items:
      - name: record_playback_extension
        path: ./libibmw_record_playback.so
        options: {}
  logging:
    core_level: INFO
    backends: [{type: console}]
  scheduling:
    executors:
      - name: record_smoke_executor
        type: thread_pool
        options: {thread_num: 2}
  messaging:
    drivers:
      - type: local
        options:
          subscriber_use_inline_executor: false
          subscriber_executor: record_smoke_executor
    publishers:
      - topic: /ibmw_record_smoke/features/transcode
        enable_drivers: [local]
  modules:
    packages:
      - path: ./librecord_smoke_pkg.so
        enable_modules: [RecordSmokeCdrModule]
    modules:
      - name: RecordSmokeCdrModule
        log_level: INFO
RecordSmokeCdrModule:
  publish_topics: [/ibmw_record_smoke/features/transcode]
  frequency_hz: 10.0
