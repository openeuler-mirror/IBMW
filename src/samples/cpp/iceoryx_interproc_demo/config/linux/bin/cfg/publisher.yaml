#
# iceoryx_interproc_demo - publisher process configuration.
#
# - runtime_id is unique per process and identifies this PoshRuntime to
#   the shared iox-roudi daemon. The subscriber uses a different id.
# - shm_init_size is intentionally tiny (256 bytes) so that publishing
#   1 KB / 16 KB / 256 KB / 1 MB samples walks through many LoanShm
#   doubling cycles, stressing the auto-grow path of the iceoryx driver.

ibmw:
  extensions:
    items:
      - name: iceoryx_extension
        path: ./libibmw_iceoryx_transport.so
        options:
          shm_init_size: 256
          runtime_id: "iceoryx_demo_pub"

  logging:
    core_level: INFO
    backends:
      - type: console

  scheduling:
    executors:
      - name: work_thread_pool
        type: thread_pool
        options:
          thread_num: 2

  messaging:
    drivers:
      - type: iceoryx
        options:
          listener_thread_name: "iox_pub_listen"
    publishers:
      - topic: "compressed_image_topic"
        enable_drivers: [iceoryx]

  modules:
    modules:
      - name: PublisherModule
        log_level: INFO
