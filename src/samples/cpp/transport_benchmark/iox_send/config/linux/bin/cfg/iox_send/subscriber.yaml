#
# iox_send subscriber process configuration.
#
# bench_options.payload_bytes / hz / duration_sec MUST match
# publisher.yaml (subscriber uses them to pre-size LatencyStats and
# label CSV rows). csv_path receives one summary row per run; multiple
# runs append.

ibmw:
  extensions:
    items:
      - name: iceoryx_extension
        path: ./libibmw_iceoryx_transport.so
        options:
          shm_init_size: 4096
          runtime_id: "iox_send_sub"

  logging:
    core_level: INFO
    backends:
      - type: console

  scheduling:
    executors:
      - name: work_thread_pool
        type: thread_pool
        options:
          thread_num: 2

  messaging:
    drivers:
      - type: iceoryx
        options:
          listener_thread_name: "iox_sub_listen"
    subscribers:
      - topic: "iox_bench_send_topic"
        enable_drivers: [iceoryx]

  modules:
    modules:
      - name: IoxSendSubscriberModule
        log_level: INFO

IoxSendSubscriberModule:
  bench_options:
    payload_bytes: 1024
    hz: 100
    duration_sec: 30
    label: iox_send_1KB
    warmup_messages: 50
    csv_path: /tmp/ibmw_bench/iox_bench_lat.csv
