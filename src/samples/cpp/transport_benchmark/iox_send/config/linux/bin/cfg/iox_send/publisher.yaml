#
# iox_send publisher process configuration.
#
# Same iceoryx transport as iox_loaned_ctx, but the publish path is
# `ibmw::transport::Send()` -- engine CDR-serializes into a heap buffer
# and the iceoryx driver memcpy's into an SHM chunk. No extension API
# is touched in user code, so no driver pointer is injected.
#
# The `messaging.publishers` routing rule is REQUIRED: without it the
# default routing picks 'local' and Send() never reaches the iceoryx
# driver (see iox_loaned_ctx NOTES section 6.2.3 issue #5).

ibmw:
  extensions:
    items:
      - name: iceoryx_extension
        path: ./libibmw_iceoryx_transport.so
        options:
          shm_init_size: 4096
          runtime_id: "iox_send_pub"

  logging:
    core_level: INFO
    backends:
      - type: console

  scheduling:
    executors:
      - name: work_thread_pool
        type: thread_pool
        options:
          thread_num: 2

  messaging:
    drivers:
      - type: iceoryx
        options:
          listener_thread_name: "iox_pub_listen"
    publishers:
      - topic: "iox_bench_send_topic"
        enable_drivers: [iceoryx]

  modules:
    modules:
      - name: IoxSendPublisherModule
        log_level: INFO

IoxSendPublisherModule:
  bench_options:
    payload_bytes: 1024
    hz: 100
    duration_sec: 30
    label: iox_send_1KB
    warmup_messages: 50
