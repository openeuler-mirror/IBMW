ibmw:
  extensions:
    items: [{name: dds_extension, path: ./libibmw_dds_transport.so, options: {domain_id: 45}}]
  messaging:
    drivers:
      - type: dds
        options: {domain_id: 45, ros2_compatible: true, ros2_topic_prefix: "rt", publishers: [{topic: "/mw_perf/topology/raw", qos: {history: keep_last, depth: 32, reliability: reliable, durability: volatile}}]}
    publishers: [{topic: "/mw_perf/topology/raw", enable_drivers: [dds]}]
    subscribers: []
  modules: {modules: [{name: TopologyDdsSource, log_level: INFO}]}
