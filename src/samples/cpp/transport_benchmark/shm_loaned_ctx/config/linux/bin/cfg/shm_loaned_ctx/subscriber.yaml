#
# shm_loaned_ctx subscriber process configuration (self-developed shm transport,
# driver_name "iceoryx", no RouDi).
# The subscriber is iox_send's module; bench_options.topic selects this
# lane's topic.
ibmw:
  extensions:
    items:
      - name: shm_extension
        path: ./libibmw_shm_transport.so
        options:
          driver_name: iceoryx
          shm_init_size: 4096
          runtime_id: "shm_loaned_ctx_sub"

  logging:
    core_level: INFO
    backends:
      - type: console

  scheduling:
    executors:
      - name: work_thread_pool
        type: thread_pool
        options:
          thread_num: 2

  messaging:
    drivers:
      - type: iceoryx
        options:
          listener_thread_name: "shm_sub_listen"
    subscribers:
      - topic: "shm_bench_ctx_topic"
        enable_drivers: [iceoryx]

  modules:
    modules:
      - name: IoxSendSubscriberModule
        log_level: INFO

IoxSendSubscriberModule:
  bench_options:
    payload_bytes: 1024
    hz: 100
    duration_sec: 30
    label: shm_loaned_ctx_1KB
    warmup_messages: 50
    topic: shm_bench_ctx_topic
    csv_path: /tmp/ibmw_bench/shm_bench_lat.csv
