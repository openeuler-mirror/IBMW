#
# shm_loaned_pod subscriber process configuration: iox_loaned_pod/subscriber.yaml with the
# extension item switched to the self-developed shm transport. driver_name
# "iceoryx" keeps the messaging section unchanged. No RouDi daemon is needed.
ibmw:
  extensions:
    items:
      - name: shm_extension
        path: ./libibmw_shm_transport.so
        options:
          driver_name: iceoryx
          shm_init_size: 4096
          runtime_id: "shm_loaned_pod_sub"

  logging:
    core_level: INFO
    backends:
      - type: console

  scheduling:
    executors:
      - name: work_thread_pool
        type: thread_pool
        options:
          thread_num: 2

  messaging:
    drivers:
      - type: iceoryx
        options:
          listener_thread_name: "iox_sub_listen"

  modules:
    modules:
      - name: ShmLoanedPodSubscriberModule
        log_level: INFO

# Per-module configuration. The Configurator surfaces this subtree to the
# module via GetConfigFilePath() (config_subsystem.cc serialises just this
# block into a temp file before handing the path back).
ShmLoanedPodSubscriberModule:
  bench_options:
    payload_bytes: 1024
    hz: 100
    duration_sec: 30
    label: shm_loaned_pod_1KB
    warmup_messages: 50
    csv_path: /tmp/ibmw_bench/shm_bench_lat.csv
