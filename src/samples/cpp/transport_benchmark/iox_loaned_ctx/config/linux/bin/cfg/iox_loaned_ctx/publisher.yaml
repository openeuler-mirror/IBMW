#
# iox_loaned_ctx publisher process configuration.
#
# - bench_options drives the publish loop (size/rate/duration/label).
# - shm_init_size hints the iceoryx publisher pool. The driver still
#   doubles the chunk on demand (see LoanSerializedSampleWithCtx loop)
#   but a sensible hint avoids cold-path reallocations during warmup.
# - runtime_id MUST differ from the subscriber's runtime_id; iox-roudi
#   registers each PoshRuntime by id.

ibmw:
  extensions:
    items:
      - name: iceoryx_extension
        path: ./libibmw_iceoryx_transport.so
        options:
          shm_init_size: 4096
          runtime_id: "iox_loaned_ctx_pub"

  logging:
    core_level: INFO
    backends:
      - type: console

  scheduling:
    executors:
      - name: work_thread_pool
        type: thread_pool
        options:
          thread_num: 2

  messaging:
    drivers:
      - type: iceoryx
        options:
          listener_thread_name: "iox_pub_listen"
    publishers:
      # Route the ctx topic explicitly to the iceoryx driver. Without
      # this rule the default routing picks 'local' and our driver-side
      # RegisterSendType callback (which populates iceoryx_bus_) never
      # fires -- LoanSerializedSampleWithCtx then can't find the
      # publisher and warns "standard topic not registered".
      - topic: "iox_bench_ctx_topic"
        enable_drivers: [iceoryx]

  modules:
    modules:
      - name: IoxLoanedCtxPublisherModule
        log_level: INFO

# Per-module configuration. Configurator surfaces this subtree to the
# module via GetConfigFilePath() (config_subsystem.cc serialises just this
# block into a temp file before handing the path back).
IoxLoanedCtxPublisherModule:
  bench_options:
    payload_bytes: 1024
    hz: 100
    duration_sec: 30
    label: iox_loaned_ctx_1KB
    warmup_messages: 50
