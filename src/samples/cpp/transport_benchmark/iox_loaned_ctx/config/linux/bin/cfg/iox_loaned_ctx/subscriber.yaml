#
# iox_loaned_ctx subscriber process configuration.
#
# bench_options.payload_bytes / hz / duration_sec MUST match publisher.yaml
# (subscriber uses them to pre-size LatencyStats and label CSV rows).
# csv_path receives one summary row per run; multiple runs append.

ibmw:
  extensions:
    items:
      - name: iceoryx_extension
        path: ./libibmw_iceoryx_transport.so
        options:
          shm_init_size: 4096
          runtime_id: "iox_loaned_ctx_sub"

  logging:
    core_level: INFO
    backends:
      - type: console

  scheduling:
    executors:
      - name: work_thread_pool
        type: thread_pool
        options:
          thread_num: 2

  messaging:
    drivers:
      - type: iceoryx
        options:
          listener_thread_name: "iox_sub_listen"
    subscribers:
      # Route the ctx topic to the iceoryx driver so OnMessage<> wires
      # through the iceoryx Listener (and not through the default 'local'
      # fallback which would silently never deliver).
      - topic: "iox_bench_ctx_topic"
        enable_drivers: [iceoryx]

  modules:
    modules:
      - name: IoxLoanedCtxSubscriberModule
        log_level: INFO

IoxLoanedCtxSubscriberModule:
  bench_options:
    payload_bytes: 1024
    hz: 100
    duration_sec: 30
    label: iox_loaned_ctx_1KB
    warmup_messages: 50
    csv_path: /tmp/ibmw_bench/iox_bench_lat.csv
