#
# iox_loan_v2 publisher process configuration.
#
# - bench_options drives the publish loop (size/rate/duration/label).
# - shm_init_size is sized to comfortably hold one payload chunk so the
#   warmup phase doesn't stall on iceoryx LoanShm doublings.
# - runtime_id MUST differ from the subscriber's runtime_id (the iox-roudi
#   daemon registers each PoshRuntime by id).

ibmw:
  extensions:
    items:
      - name: iceoryx_extension
        path: ./libibmw_iceoryx_transport.so
        options:
          shm_init_size: 4096
          runtime_id: "iox_loan_v2_pub"

  logging:
    core_level: INFO
    backends:
      - type: console

  scheduling:
    executors:
      - name: work_thread_pool
        type: thread_pool
        options:
          thread_num: 2

  messaging:
    drivers:
      - type: iceoryx
        options:
          listener_thread_name: "iox_pub_listen"
    # Route this topic exclusively to iceoryx. Without this, dispatcher
    # walks cached_drivers in registration order; DDS driver ALSO
    # supports LoanSample(kPodOnly) for Plain types, so whichever
    # driver was registered first wins the loan and we no longer
    # measure the iceoryx path. See iox_send publisher.yaml for the
    # same rationale on the Send() side.
    publishers:
      - topic: "iox_bench_loan_v2_topic"
        enable_drivers: [iceoryx]

  modules:
    modules:
      - name: IoxLoanV2PublisherModule
        log_level: INFO

# Per-module configuration. The Configurator surfaces this subtree to the
# module via GetConfigFilePath() (config_subsystem.cc serialises just this
# block into a temp file before handing the path back).
IoxLoanV2PublisherModule:
  bench_options:
    payload_bytes: 1024
    hz: 100
    duration_sec: 30
    label: iox_loan_v2_1KB
    warmup_messages: 50
