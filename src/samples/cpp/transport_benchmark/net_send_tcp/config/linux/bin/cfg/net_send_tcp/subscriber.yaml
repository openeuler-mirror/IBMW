#
# net_send_tcp subscriber process configuration.
#
# Mirror of net_send_tcp/publisher.yaml. Subscriber side OWNS the
# TCP listener (tcp_options.listen_port: 5200). Publisher connects
# to this address as a pure TCP client.
#
# bench_options.payload_bytes / hz / duration_sec MUST match
# publisher.yaml.

ibmw:
  extensions:
    items:
      - name: net_extension
        path: ./libibmw_net_transport.so
        options:
          thread_num: 2
          tcp_options:
            listen_ip: "127.0.0.1"
            listen_port: 5200

  logging:
    core_level: INFO
    backends:
      - type: console

  scheduling:
    executors:
      - name: work_thread_pool
        type: thread_pool
        options:
          thread_num: 2

  messaging:
    drivers:
      - type: tcp
    subscribers:
      - topic: "net_bench_send_tcp_topic"
        enable_drivers: [tcp]

  modules:
    modules:
      - name: NetSendTcpSubscriberModule
        log_level: INFO

NetSendTcpSubscriberModule:
  bench_options:
    payload_bytes: 1024
    hz: 100
    duration_sec: 30
    label: net_send_tcp_1KB
    warmup_messages: 50
    csv_path: /tmp/ibmw_bench/iox_bench_lat.csv
