#
# dds_send_shm publisher process configuration.
#
# Standard `ibmw::transport::Send()` over the dds extension. The driver
# CDR-serializes the BenchPlainPayload<N> via GenericDdsPubSubType<T>::
# serialize (FastCDR free-function path), then FastDDS carries the
# bytes over its DDS transport (DataSharing if both sides advertise
# SHM, UDP fallback otherwise). The publish path is NOT zero-copy --
# at minimum one CDR encode + one transport-side copy.
#
# Differences vs cfg/dds_loaned/publisher.yaml:
#   - No PlainDdsPubSubType opt-in (Send<T> path doesn't need
#     is_plain()==true; it goes through the generic CDR pipeline).
#   - domain_id 43 (vs dds_loaned's 42) so the two samples can run
#     side-by-side without RTPS discovery cross-talk.
#   - topic "dds_bench_send_shm_topic" (vs dds_loaned's
#     "dds_bench_loaned_topic") so the per-sample CSV labels and
#     subscriber routing stay clean.
#
# The `messaging.publishers` routing rule is REQUIRED: without it the
# default routing picks 'local' and Send() never reaches the dds
# driver (see iox_loaned_ctx NOTES section 6.2.3 issue #5 -- same
# transport-bus contract applies to every driver).

ibmw:
  extensions:
    items:
      - name: dds_extension
        path: ./libibmw_dds_transport.so
        options:
          domain_id: 43
          transport_policy: shm_only

  logging:
    core_level: INFO
    backends:
      - type: console

  scheduling:
    executors:
      - name: work_thread_pool
        type: thread_pool
        options:
          thread_num: 2

  messaging:
    drivers:
      - type: dds
        options:
          domain_id: 43
          ros2_compatible: false
    publishers:
      - topic: "dds_bench_send_shm_topic"
        enable_drivers: [dds]

  modules:
    modules:
      - name: DdsSendPublisherModule
        log_level: INFO

DdsSendPublisherModule:
  bench_options:
    payload_bytes: 1024
    hz: 100
    duration_sec: 30
    message_count: 0
    start_delay_ms: 0
    label: dds_send_shm_1KB
    warmup_messages: 50
