ibmw:
  logging:
    core_level: INFO # Trace/Debug/Info/Warn/Error/Fatal/Off
    backends:
      - type: console
        options:
          pattern: "[%c.%f][%A][%l][%t][%n][%G] %v"
  scheduling:
    executors:
      - name: work_executor
        type: dedicated
  modules:
    packages:
      - path: ./logger_pkg.dll
        enable_modules: [LoggerModule]
    modules:
      - name: LoggerModule
        log_level: TRACE
