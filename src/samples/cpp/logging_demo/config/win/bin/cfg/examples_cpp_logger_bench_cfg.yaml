ibmw:
  logging:
    core_level: INFO # Trace/Debug/Info/Warn/Error/Fatal/Off
    backends:
      - type: console
  scheduling:
    executors:
      - name: work_executor
        type: dedicated
  modules:
    packages:
      - path: ./logger_pkg.dll
        enable_modules: [LoggerBenchModule]
    modules:
      - name: LoggerBenchModule
        log_level: INFO

LoggerBenchModule:
  log_data_size: [64, 256, 1024, 4096]
  log_bench_num: 10000
