ibmw:
  logging:
    core_level: INFO # Trace/Debug/Info/Warn/Error/Fatal/Off
    backends:
      - type: console
        options:
          log_executor_name: log_executor
  scheduling:
    executors:
      - name: work_executor
        type: dedicated
      - name: log_executor
        type: dedicated
  modules:
    packages:
      - path: ./liblogger_pkg.so
        enable_modules: [LoggerModule]
    modules:
      - name: LoggerModule
        log_level: TRACE
