ibmw:
  logging:
    core_level: INFO # Trace/Debug/Info/Warn/Error/Fatal/Off
    backends:
      - type: console
      - type: rotate_file
        options:
          path: ./log
          filename: examples_cpp_logger_rotate_file.log
          max_file_size_m: 4
          max_file_num: 10
  scheduling:
    executors:
      - name: work_executor
        type: dedicated
  modules:
    packages:
      - path: ./liblogger_pkg.so
        enable_modules: [LoggerModule]
    modules:
      - name: LoggerModule
        log_level: TRACE
