schema_version: 2
project:
  name: logging_demo
  namespace: logging_demo

logging:
  core_level: INFO
  backends:
    - type: console

executors:
  - name: work_executor
    type: dedicated
  - name: sync_timer_executor
    type: thread_pool
  - name: log_executor
    type: thread_pool

modules:
  - name: LoggerModule
    type: logger
    log_level: TRACE
    executor_name: work_executor

apps:
  - name: logging_app
    type: bare
    modules: [LoggerModule]
    config_variants:
      - suffix: format
        logging:
          core_level: INFO
          backends:
            - type: console
              options:
                pattern: "[%c.%f][%A][%l][%t][%n][%G] %v"

      - suffix: rotate_file
        logging:
          core_level: INFO
          backends:
            - type: console
            - type: rotate_file
              options:
                path: ./log
                filename: logging_demo_rotate_file.log
                max_file_size_m: 4
                max_file_num: 10

      - suffix: rotate_file_with_sync
        logging:
          core_level: INFO
          backends:
            - type: console
            - type: rotate_file
              options:
                path: ./log
                filename: logging_demo_rotate_file.log
                max_file_size_m: 4
                max_file_num: 10
                enable_sync: true
                sync_interval_ms: 5000
                sync_executor_name: sync_timer_executor

      - suffix: specify_executor
        logging:
          core_level: INFO
          backends:
            - type: console
              options:
                log_executor_name: log_executor
