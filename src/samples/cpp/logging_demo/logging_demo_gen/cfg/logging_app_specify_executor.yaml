# IBMW config for logging_app (App mode, specify_executor)
#
# Usage: ./logging_app cfg/logging_app.yaml

ibmw:
  logging:
    core_level: INFO
    backends:
      - type: console
        options:
          log_executor_name: log_executor

  scheduling:
    executors:
      - name: work_executor
        type: dedicated
      - name: sync_timer_executor
        type: thread_pool
      - name: log_executor
        type: thread_pool

  modules:
    modules:
      - name: LoggerModule
        log_level: TRACE
