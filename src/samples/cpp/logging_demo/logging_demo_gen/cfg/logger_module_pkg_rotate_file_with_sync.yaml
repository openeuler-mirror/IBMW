# IBMW config for logging_app (Pkg mode, rotate_file_with_sync)
#
# Usage: ibmw run cfg/logger_module_pkg.yaml

ibmw:
  logging:
    core_level: INFO
    backends:
      - type: console
      - type: rotate_file
        options:
          path: ./log
          filename: logging_demo_rotate_file.log
          max_file_size_m: 4
          max_file_num: 10
          enable_sync: True
          sync_interval_ms: 5000
          sync_executor_name: sync_timer_executor

  scheduling:
    executors:
      - name: work_executor
        type: dedicated
      - name: sync_timer_executor
        type: thread_pool
      - name: log_executor
        type: thread_pool

  modules:
    packages:
      - path: liblogger_module_pkg.so
        enable_modules: [LoggerModule]
    modules:
      - name: LoggerModule
        log_level: TRACE
