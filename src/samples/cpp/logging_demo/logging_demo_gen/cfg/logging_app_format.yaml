# IBMW config for logging_app (App mode, format)
#
# Usage: ./logging_app cfg/logging_app.yaml

ibmw:
  logging:
    core_level: INFO
    backends:
      - type: console
        options:
          pattern: "[%c.%f][%A][%l][%t][%n][%G] %v"

  scheduling:
    executors:
      - name: work_executor
        type: dedicated
      - name: sync_timer_executor
        type: thread_pool
      - name: log_executor
        type: thread_pool

  modules:
    modules:
      - name: LoggerModule
        log_level: TRACE
