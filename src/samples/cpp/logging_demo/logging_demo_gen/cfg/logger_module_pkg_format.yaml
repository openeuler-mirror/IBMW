# IBMW config for logging_app (Pkg mode, format)
#
# Usage: ibmw run cfg/logger_module_pkg.yaml

ibmw:
  logging:
    core_level: INFO
    backends:
      - type: console
        options:
          pattern: "[%c.%f][%A][%l][%t][%n][%G] %v"

  scheduling:
    executors:
      - name: work_executor
        type: dedicated
      - name: sync_timer_executor
        type: thread_pool
      - name: log_executor
        type: thread_pool

  modules:
    packages:
      - path: liblogger_module_pkg.so
        enable_modules: [LoggerModule]
    modules:
      - name: LoggerModule
        log_level: TRACE
