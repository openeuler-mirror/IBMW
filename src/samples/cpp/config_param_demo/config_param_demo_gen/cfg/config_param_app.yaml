# IBMW config for config_param_app (App mode)
#
# Usage: ./config_param_app cfg/config_param_app.yaml

ibmw:
  logging:
    core_level: INFO
    backends:
      - type: console

  scheduling:
    executors:
      - name: work_thread_pool
        type: thread_pool
        options:
          thread_num: 2

  modules:
    modules:
      - name: ParameterModule
        log_level: INFO
