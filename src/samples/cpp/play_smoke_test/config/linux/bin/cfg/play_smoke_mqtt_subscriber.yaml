ibmw:
  config: {temp_cfg_path: ./cfg/tmp/play-smoke-mqtt}
  extensions:
    items:
      - name: mqtt_extension
        path: ./libibmw_mqtt_transport.so
        options: {broker_addr: "tcp://127.0.0.1:18885", client_id: play_smoke_mqtt_subscriber}
  logging: {core_level: INFO, backends: [{type: console}]}
  scheduling:
    executors:
      - {name: play_smoke_executor, type: thread_pool, options: {thread_num: 1}}
  messaging:
    drivers:
      - type: mqtt
        options:
          subscribers:
            - {topic: /ibmw_play_smoke/data, qos: 1}
    subscribers:
      - {topic: /ibmw_play_smoke/data, enable_drivers: [mqtt]}
  modules:
    packages:
      - {path: ./libplay_smoke_pkg.so, enable_modules: [PlaySmokeCdrSubscriberModule]}
    modules:
      - {name: PlaySmokeCdrSubscriberModule, log_level: INFO}
PlaySmokeCdrSubscriberModule:
  topics: [/ibmw_play_smoke/data]
