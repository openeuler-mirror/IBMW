ibmw:
  config: {temp_cfg_path: ./cfg/tmp/play-smoke-shm}
  extensions:
    items:
      - name: shm_extension
        path: ./libibmw_shm_transport.so
        options: {shm_init_size: 1024, runtime_id: play_smoke_shm_subscriber}
  logging: {core_level: INFO, backends: [{type: console}]}
  scheduling:
    executors:
      - {name: play_smoke_executor, type: thread_pool, options: {thread_num: 1}}
  messaging:
    drivers: [{type: shm}]
    subscribers:
      - {topic: /ibmw_play_smoke/data, enable_drivers: [shm]}
  modules:
    packages:
      - {path: ./libplay_smoke_pkg.so, enable_modules: [PlaySmokeCdrSubscriberModule]}
    modules:
      - {name: PlaySmokeCdrSubscriberModule, log_level: INFO}
PlaySmokeCdrSubscriberModule:
  topics: [/ibmw_play_smoke/data]
