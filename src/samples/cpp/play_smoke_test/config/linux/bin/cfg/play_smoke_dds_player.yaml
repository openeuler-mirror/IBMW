ibmw:
  runtime_graph:
    type_support_pkgs: [../libplay_smoke_ts.so]
  extensions:
    items:
      - name: dds_extension
        path: ../libibmw_dds_transport.so
        options: {domain_id: 88, participant_name: play_smoke_dds_player}
  logging: {core_level: INFO, backends: [{type: console}]}
  scheduling:
    executors:
      - {name: play_smoke_executor, type: thread_pool, options: {thread_num: 2}}
  messaging:
    drivers:
      - type: dds
        options:
          publishers:
            - topic: /ibmw_play_smoke/data
              qos: {history: keep_last, depth: 20, reliability: reliable, durability: volatile}
    publishers:
      - {topic: /ibmw_play_smoke/data, enable_drivers: [dds]}
