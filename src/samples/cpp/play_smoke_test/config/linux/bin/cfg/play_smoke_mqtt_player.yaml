ibmw:
  bag_playback:
    type_support_pkgs: [../libplay_smoke_ts.so]
  extensions:
    items:
      - name: mqtt_extension
        path: ../libibmw_mqtt_transport.so
        options: {broker_addr: "tcp://127.0.0.1:18885", client_id: play_smoke_mqtt_player}
  logging: {core_level: INFO, backends: [{type: console}]}
  scheduling:
    executors:
      - {name: play_smoke_executor, type: thread_pool, options: {thread_num: 2}}
  messaging:
    drivers:
      - type: mqtt
        options:
          publishers:
            - {topic: /ibmw_play_smoke/data, qos: 1}
    publishers:
      - {topic: /ibmw_play_smoke/data, enable_drivers: [mqtt]}
