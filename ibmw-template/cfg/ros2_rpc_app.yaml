# IBMW ROS2 RPC demo: App mode with local RPC driver
#
# Usage: ./ros2_rpc_app cfg/ros2_rpc_app.yaml

ibmw:
  logging:
    core_level: INFO
    backends:
      - type: console

  scheduling:
    executors:
      - name: work_thread_pool
        type: thread_pool
        options:
          thread_num: 4
      - name: timeout_handle
        type: timer
        options:
          bind_executor: work_thread_pool

  service:
    drivers:
      - type: local
        options:
          timeout_executor: timeout_handle
    clients:
      - func_name: "(.*)"
        enable_drivers: [local]
    servers:
      - func_name: "(.*)"
        enable_drivers: [local]

  modules:
    modules:
      - name: Ros2RpcServerModule
        log_level: INFO
      - name: Ros2RpcClientModule
        log_level: INFO
