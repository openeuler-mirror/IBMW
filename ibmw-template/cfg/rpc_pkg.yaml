# IBMW RPC demo: Pkg mode with local RPC driver
#
# Usage: ibmw run cfg/rpc_pkg.yaml

ibmw:
  logging:
    core_level: INFO
    backends:
      - type: console

  scheduling:
    executors:
      - name: time_schedule_executor
        type: thread_pool
        options:
          thread_num: 1
      - name: work_thread_pool
        type: thread_pool
        options:
          thread_num: 2
      - name: timeout_handle
        type: timer
        options:
          bind_executor: work_thread_pool

  service:
    drivers:
      - type: local
        options:
          timeout_executor: timeout_handle
    clients:
      - func_name: "(.*)"
        enable_drivers: [local]
    servers:
      - func_name: "(.*)"
        enable_drivers: [local]

  modules:
    packages:
      - path: ./librpc_pkg.so
    modules:
      - name: RpcServerModule
        log_level: INFO
      - name: RpcClientModule
        log_level: INFO
