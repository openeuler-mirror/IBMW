# JSON/local pub/sub skeleton using an IBMW-owned JSON type.
schema_version: 2
project:
  name: json_local_pubsub
  namespace: migration_practice

json_types:
  messages:
    - name: TextMsg
      fields:
        - name: data
          type: string
          default: '"hello from a local application"'

modules:
  - name: PublisherModule
    type: publisher
    transport: json
    topic: "chatter"
    message_type: TextMsg
  - name: SubscriberModule
    type: subscriber
    transport: json
    topic: "chatter"
    message_type: TextMsg

apps:
  - name: json_local_pubsub_app
    modules: [PublisherModule, SubscriberModule]
