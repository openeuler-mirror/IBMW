# DDS/ROS2-compatible service skeleton.
# Example shape: AddTwoInts request/response over IBMW DDS RPC.
schema_version: 2
project:
  name: dds_ros2_service
  namespace: migration_practice

messages:
  AddTwoIntsService:
    wire:
      dds:
        service: AddTwoIntsService

dds_types:
  namespace: migration_practice
  groups:
    - name: AddTwoInts
      messages:
        - name: AddTwoInts_Request
          fields:
            - {name: a, type: int64, default: "0"}
            - {name: b, type: int64, default: "0"}
        - name: AddTwoInts_Response
          fields:
            - {name: sum, type: int64, default: "0"}
  rpc_services:
    - name: AddTwoIntsService
      group: AddTwoInts
      srv: example_interfaces/srv/AddTwoInts
      methods:
        - name: AddTwoInts
          request: AddTwoInts_Request
          response: AddTwoInts_Response

dds_driver:
  domain_id: 0
  ros2_compatible_mode: true

modules:
  - name: RpcServerModule
    type: rpc_server
    transport: dds
    message: AddTwoIntsService
  - name: RpcClientModule
    type: rpc_client
    transport: dds
    custom_config:
      rpc_frq: 2.0
    message: AddTwoIntsService

apps:
  - name: dds_ros2_service_server_app
    type: rpc
    modules: [RpcServerModule]
  - name: dds_ros2_service_client_app
    type: rpc
    modules: [RpcClientModule]
